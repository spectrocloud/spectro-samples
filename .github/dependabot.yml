version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "main"
    commit-message:
      prefix: "chore:"

  - package-ecosystem: "gomod"
    directories:
      - "/scripts/*"
    schedule:
      interval: "monthly"
    target-branch: "main"
    commit-message:
      prefix: "chore:"

  - package-ecosystem: "terraform"
    directories:
      - "/terraform/cluster-profiles/*"
    schedule:
      interval: "monthly"
    target-branch: "main"
    commit-message:
      prefix: "chore:"